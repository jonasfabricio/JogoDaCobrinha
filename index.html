<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Labirinto 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="flash" class="flash"></div>

  <header class="hud">
    <div class="stat"><span>Nível</span><strong id="level">1</strong></div>
    <div class="stat"><span>Tempo</span><strong id="time">0:00</strong></div>
    <div class="stat"><span>Cristais</span><strong><span id="gems">0/0</span><i id="key-icon" class="key-icon" title="Chave do portal">🔑</i></strong></div>
    <div class="stat"><span>Pontos</span><strong id="score">0</strong></div>
    <div class="stat combo" id="combo-stat"><span>Combo</span><strong id="combo">×1</strong><i id="combo-bar" class="combo-bar"></i></div>
    <div class="stat"><span>Vidas</span><strong id="lives" class="lives">♥♥♥</strong></div>
    <button type="button" id="mute" class="icon ghost-icon" title="Desligar som (M)" aria-pressed="false">🔊</button>
    <button type="button" id="restart" class="icon" title="Recomeçar do nível 1">↻</button>
  </header>

  <div id="toast" class="toast"></div>

  <div class="pad" aria-label="Controles">
    <button type="button" data-dir="0" class="up">▲</button>
    <button type="button" data-dir="2" class="left">◀</button>
    <button type="button" data-dir="1" class="down">▼</button>
    <button type="button" data-dir="3" class="right">▶</button>
  </div>

  <section id="overlay" class="overlay" hidden>
    <div class="card">
      <p class="eyebrow" id="ov-eyebrow"></p>
      <h1 id="ov-title"></h1>
      <div id="ov-text" class="ov-text"></div>
      <button type="button" id="ov-btn"></button>
    </div>
  </section>

  <aside id="me-panel" class="panel me-panel" hidden>
    <p class="panel-title">Seu recorde</p>
    <p class="me-best"><strong id="me-best">0</strong><span id="me-level">nível —</span></p>
    <div class="me-account">
      <span id="me-email" class="me-email"></span>
      <button type="button" id="logout" class="link">Sair</button>
    </div>
  </aside>

  <aside id="podium" class="panel podium" hidden aria-live="polite">
    <p class="panel-title">🏆 Pódio</p>
    <ol id="podium-list" class="podium-list"></ol>
  </aside>

  <section id="auth" class="overlay auth" hidden>
    <form id="auth-form" class="card" novalidate>
      <p class="eyebrow">Labirinto 3D</p>
      <h1 id="auth-title">Crie sua conta</h1>
      <p id="auth-sub" class="auth-sub"></p>

      <label class="field" for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="email" placeholder="voce@email.com" maxlength="254" required>

      <label class="field" for="auth-password">Senha</label>
      <div class="pw">
        <input id="auth-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button type="button" id="auth-eye" class="eye" aria-pressed="false">Mostrar</button>
      </div>

      <p id="auth-error" class="auth-error" role="alert"></p>
      <button type="submit" id="auth-submit">Criar conta</button>

      <div class="divider"><span id="auth-switch-text">Já tem uma conta?</span></div>
      <button type="button" id="auth-switch" class="secondary">Já tenho uma conta</button>
    </form>
  </section>

  <script src="account.js"></script>
  <script src="audio.js"></script>
  <script src="podium.js"></script>
  <script src="game.js"></script>
</body>
</html>
