<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Labirinto 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="flash" class="flash"></div>

  <header class="hud">
    <div class="stat"><span>Nível</span><strong id="level">1</strong></div>
    <div class="stat"><span>Tempo</span><strong id="time">0:00</strong></div>
    <div class="stat"><span>Cristais</span><strong id="gems">0/0</strong></div>
    <div class="stat"><span>Pontos</span><strong id="score">0</strong></div>
    <div class="stat"><span>Vidas</span><strong id="lives" class="lives">♥♥♥</strong></div>
    <button type="button" id="restart" class="icon" title="Recomeçar do nível 1">↻</button>
  </header>

  <div id="toast" class="toast"></div>

  <div class="pad" aria-label="Controles">
    <button type="button" data-dir="0" class="up">▲</button>
    <button type="button" data-dir="2" class="left">◀</button>
    <button type="button" data-dir="1" class="down">▼</button>
    <button type="button" data-dir="3" class="right">▶</button>
  </div>

  <section id="overlay" class="overlay">
    <div class="card">
      <p class="eyebrow" id="ov-eyebrow"></p>
      <h1 id="ov-title"></h1>
      <div id="ov-text" class="ov-text"></div>
      <button type="button" id="ov-btn"></button>
    </div>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
